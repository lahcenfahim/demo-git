name: Cascading Lists Workflow

on:
  workflow_dispatch:  # Manually trigger the workflow

jobs:
  gather-files:
    runs-on: windows-latest
    outputs:
      cascading_list: ${{ steps.generate-files.outputs.cascading_list }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
    
    - name: Create test files
      run: |
        New-Item -Path test1.txt -ItemType File
        New-Item -Path test2.txt -ItemType File
        New-Item -Path test3.txt -ItemType File
        New-Item -Path test4.txt -ItemType File
        New-Item -Path test5.txt -ItemType File

    - name: List Files in Folder and Create Cascading List
      id: generate-files
      run: |
        # Get all file names in the 'files/' folder
        $fileNames = (Get-ChildItem -Path $env:GITHUB_ENV/ -File | ForEach-Object { $_.Name })
        
        # Simulate cascading logic (e.g., creating lists based on file name prefixes, extensions, etc.)
        $cascadingList = $fileNames -join ","

        # Set the cascading list as an output
        echo "::set-output name=cascading_list::$cascadingList"
      shell: pwsh

  use-cascading-list:
    needs: gather-files
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Use Cascading List from Previous Job
      run: |
        # Access the cascading list from the previous job's output
        $cascadingList = '${{ needs.gather-files.outputs.cascading_list }}'

        # Split the list by commas
        $listItems = $cascadingList -split ','

        # Process each item in the list
        foreach ($item in $listItems) {
          Write-Output "Processing item: $item"
          # You can add your own logic here to process each file or cascade
        }
      shell: pwsh
