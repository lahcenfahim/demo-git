name: Test Workflow
on: push

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Publish Test Results
      run: |
        pwd
        Get-ChildItem -Path "D:\a\demo-git\demo-git"
        echo "![Image](D:\a\demo-git\demo-git\logo.png)" >> "$GITHUB_STEP_SUMMARY"
