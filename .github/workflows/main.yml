name: Test Workflow
on: push

jobs:
  build:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Publish Test Results
      run: |
        echo "$env:GITHUB_WORKSPACE"
        echo "![Image]($env:GITHUB_WORKSPACE\image\logo.png)" >> "$env:GITHUB_STEP_SUMMARY"
