name: "Test Hello Action"
on: [push]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: |
          pwd
          ls -ltr

      - name: Use action composite
        uses: lahcenfahim/demo-git/hello-action@v2
        with:
          name: "Lahcen"
          greeting: "Hey"
