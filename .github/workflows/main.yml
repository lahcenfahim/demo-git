name: "Test Hello Action"
on: [push]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: |
          pwd

      - name: Use action composite
        uses: lahcenfahimgitgit/demo-git/hello-action@v2
        with:
          name: "Lahcen"
          greeting: "Hey"
