name: Cleanup Old Workflow Runs
on: push

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.5'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyJWT cryptography

      - name: Generate JWT Token
        id: generate_jwt
        run: |
          jwt_token=$(python get_jwt_token.py --app_id "${{secrets.APP_ID}}" --private_key "${{secrets.PRIVATE_KEY_APP}}")
          echo "JWT_TOKEN=$jwt_token" >> $GITHUB_ENV

      - name: Get Installation Access Token
        run: |
          installation_id=$(curl -H "Authorization: Bearer ${{env.JWT_TOKEN}}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/app/installations | jq -r '.[0].id')
          access_token=$(curl -X POST -H "Authorization: Bearer ${{env.JWT_TOKEN}}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/app/installations/${installation_id}/access_tokens | jq -r '.token')
          echo "ACCESS_TOKEN=$access_token" >> $GITHUB_ENV

      - name: Delete Old Workflow Runs
        run: |
            # Fetch all workflow runs
            all_runs=$(curl -s -H "Authorization: token $ACCESS_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{github.repository}}/actions/runs")

            # Extract run IDs and their creation dates
            run_ids=$(echo "$all_runs" | jq -r '.workflow_runs[] | "\(.id) \(.created_at)"')

            # Get the current date minus 1 hour in ISO format
            cutoff_date=$(date -d '1 hour ago' --utc +%Y-%m-%dT%H:%M:%SZ)

            # Filter out runs older than 1 hour
            old_runs=$(echo "$run_ids" | awk -v cutoff="$cutoff_date" '$2 < cutoff {print $1}')

            # Delete old runs
            for run_id in $old_runs; do
                echo "Deleting workflow run ID: $run_id"
                curl -s -X DELETE -H "Authorization: token $ACCESS_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/${{github.repository}}/actions/runs/$run_id"
            done