name: dev-team69/demo-project
on:
  push:
  workflow_dispatch:
concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
jobs:
  build-job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - run: echo "Compiling the code..."
    - run: echo "Compile complete."
    - run: mkdir build/
    - run: echo "My app binary file" > build/execution-binary-file-v1
  unit-test-job:
    needs: build-job
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - run: echo "Running unit tests... This will take about 60 seconds."
    - run: echo "Code coverage is 90%"
  lint-test-job:
    needs: build-job
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - run: echo "Linting code... This will take about 10 seconds."
    - run: echo "No lint issues found."
  validation-job:
    needs:
    - unit-test-job
    - lint-test-job
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - run: echo "Hello from test stage"
  deploy-job:
    needs: validation-job
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - run: echo "Deploying application..."
    - run: echo "Application successfully deployed."
